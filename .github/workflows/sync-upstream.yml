name: Sync Upstream Sources

on:
  schedule:
    - cron: "0 0 * * 1" # Weekly Monday midnight UTC
  workflow_dispatch:

permissions:
  issues: write

jobs:
  # The matrix comes from scripts/lib/upstream-sources.ts so a new module
  # needs one registry entry and nothing here.
  sources:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - id: list
        run: |
          set -euo pipefail
          MATRIX=$(bun scripts/list-sources.ts)
          # An empty matrix instantiates zero jobs and reports success —
          # a watcher that measures nothing while looking green.
          if [ "$(printf '%s' "$MATRIX" | jq 'length')" -eq 0 ]; then
            echo "::error::upstream source registry produced an empty matrix"
            exit 1
          fi
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  check:
    needs: sources
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJson(needs.sources.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Compare pinned version against the latest upstream release
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          ID: ${{ matrix.source.id }}
          REPO: ${{ matrix.source.repo }}
        run: |
          set -euo pipefail
          UPSTREAM=$(gh api "repos/$REPO/releases/latest" --jq '.tag_name' 2>/dev/null || true)
          if [ -z "$UPSTREAM" ]; then
            echo "No published release for $REPO — nothing to compare."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CURRENT=$(jq -r '.version' ".upstream-versions/$ID.json")
          echo "Current:  $CURRENT"
          echo "Upstream: $UPSTREAM"
          {
            echo "upstream=$UPSTREAM"
            echo "current=$CURRENT"
          } >> "$GITHUB_OUTPUT"
          if [ "${UPSTREAM#v}" != "${CURRENT#v}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report the drift
        if: steps.compare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL: ${{ matrix.source.label }}
          ID: ${{ matrix.source.id }}
          REPO: ${{ matrix.source.repo }}
          KIND: ${{ matrix.source.kind }}
          UPSTREAM: ${{ steps.compare.outputs.upstream }}
          CURRENT: ${{ steps.compare.outputs.current }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TITLE="Upstream $LABEL update: $UPSTREAM"

          case "$KIND" in
            core)   SYNC_CMD="bun run sync -- --tag $UPSTREAM" ;;
            custom) SYNC_CMD="bun run sync -- --$ID-tag $UPSTREAM" ;;
            # Registry modules are resolved by the installer from the core
            # release; they cannot be bumped independently.
            *)      SYNC_CMD="bun run sync   # resolved by the installer for the pinned core release" ;;
          esac

          BODY=$(printf '%s\n' \
            "A new release of [$REPO](https://github.com/$REPO) is available." \
            "" \
            "## Versions" \
            "" \
            "- **Pinned:** $CURRENT" \
            "- **Upstream:** $UPSTREAM" \
            "- **Delivery:** $KIND" \
            "" \
            "## Action required" \
            "" \
            "1. \`$SYNC_CMD\`" \
            "2. \`bun run validate && bun run test:unit\`" \
            "3. \`.upstream-versions/$ID.json\` is rewritten by the sync — never hand-edit it." \
            "" \
            "See [releases](https://github.com/$REPO/releases) for the changelog.")

          # The job summary is the sink that always works. Issues are
          # optional: this repository is a fork, and a fork ships with its
          # issue tracker disabled, which makes `gh issue list` exit 1 and
          # would otherwise abort the whole step under `set -e`.
          {
            echo "## $TITLE"
            echo
            echo "$BODY"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning title=$TITLE::pinned $CURRENT, upstream $UPSTREAM"

          HAS_ISSUES=$(gh api "repos/$TARGET_REPO" --jq '.has_issues' 2>/dev/null || echo false)
          if [ "$HAS_ISSUES" != "true" ]; then
            echo "Issues are disabled on $TARGET_REPO — reported in the job summary only."
            exit 0
          fi

          # Exact-title match, not GitHub's relevance-ranked full-text
          # search: "Upstream TEA update: v1.23.3" and "… v1.24.0" share
          # four of five tokens, so a search hit would suppress the new one.
          EXISTING=$(gh issue list --repo "$TARGET_REPO" --state open --limit 200 \
            --json number,title --jq "[.[] | select(.title == \"$TITLE\")][0].number" 2>/dev/null || echo "")
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            echo "Issue #$EXISTING already tracks this."
            exit 0
          fi

          gh label create upstream-sync --repo "$TARGET_REPO" \
            --description "Upstream version update" --color "0E8A16" 2>/dev/null || true
          gh issue create --repo "$TARGET_REPO" --title "$TITLE" --label upstream-sync --body "$BODY"
